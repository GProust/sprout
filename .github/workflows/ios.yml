name: iOS

# The iOS build, and the guard on the shared specification.
#
# Everything here runs without an Apple Developer account, without a signing
# certificate and without a physical device: SproutKit is bytes in, bytes out,
# and a simulator build needs no identity. That is deliberate — it keeps CI the
# build verifier for iOS the way ADR-0006 made it for Android, so a change can
# be proven correct from a machine that is not a Mac.
#
# What CI still cannot do: run on a real radio, take an App Store screenshot, or
# produce anything installable. Those need a Mac and, for the last one, the
# credentials listed in docs/RELEASING.md.

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      # What this workflow itself writes back, and the store listing text.
      # Neither can change what the app renders, and capturing on a macOS
      # runner to prove that a PNG is still a PNG is fifteen minutes for
      # nothing. screenshots.yml keeps Android out of the same loop with its
      # "Detect UI changes" gate.
      - '!ios/screenshots/**'
      - '!ios/fastlane/**'
      - 'spec/**'
      - 'android/app/src/main/res/values*/strings.xml'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [ main ]
    # Duplicated rather than anchored: GitHub Actions' support for YAML aliases
    # is not something to find out about from a workflow that silently stops
    # running.
    paths:
      - 'ios/**'
      - '!ios/screenshots/**'
      - '!ios/fastlane/**'
      - 'spec/**'
      - 'android/app/src/main/res/values*/strings.xml'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# Lets the screenshots job push the captured images back to the PR branch, the
# way screenshots.yml does for Android.
permissions:
  contents: write

concurrency:
  # A push supersedes the run before it. Without this a few pushes in a row have
  # three Macs each building the same app, competing for runners and answering
  # about commits nobody is waiting on any more — which is how the screenshot
  # job ended up looking like it had hung when it was really just queued behind
  # its own predecessors.
  group: ios-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Specification & strings
    # No Mac needed to check that the vectors are what the generator produces,
    # so this runs on Linux and gives a fast answer before the Mac starts.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The vectors are the only thing standing between "both apps compile" and
      # "both apps agree". Regenerating them must be a no-op: if it is not, the
      # committed vectors were hand-edited or a change to the generator was not
      # carried through, and in either case the two apps are being checked
      # against something nobody derived.
      - name: The committed vectors are the ones the generator produces
        run: |
          node spec/vectors/generate.mjs
          if [ -n "$(git status --porcelain -- spec/vectors)" ]; then
            echo "::error::spec/vectors differs from what generate.mjs produces."
            echo "Re-run 'node spec/vectors/generate.mjs' and commit the result."
            git status --porcelain -- spec/vectors
            git diff -- spec/vectors
            exit 1
          fi
          echo "Committed vectors match the generator."

      # The string catalog is generated from Android's resources, for the same
      # reason as the vectors: one source, so the two apps cannot drift on copy.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: The committed strings are the ones Android's resources produce
        run: |
          python3 ios/tools/strings_from_android.py
          if [ -n "$(git status --porcelain -- ios/Sprout/Sources/Localizable.xcstrings)" ]; then
            echo "::error::Localizable.xcstrings differs from the Android string resources."
            echo "Re-run 'python3 ios/tools/strings_from_android.py' and commit the result."
            git diff --stat -- ios/Sprout/Sources/Localizable.xcstrings
            exit 1
          fi
          echo "Committed string catalog matches Android."

      # A mistyped key builds fine and renders as the key itself, which survives
      # review until somebody opens that screen in that language.
      - name: Every string key the app uses is in the catalog
        run: python3 ios/tools/check_string_keys.py

      # ADR-0014's claim is about *absence*, and absence is not what a feature
      # test notices going missing. Android keeps it by not declaring INTERNET —
      # the OS refuses the socket. iOS has no such permission, so the only way to
      # make the same promise here is to check that the code which would open a
      # connection does not exist.
      - name: Sprout cannot reach the network
        run: python3 ios/tools/check_no_network.py

      # ADR-0014's pin, for the second app. `check_no_network.py` proves there is
      # no code that opens a connection; this proves nothing *declares* a way in
      # either — the counterpart of Android's AttackSurfaceTest, which ADR-0015
      # says the privacy claim needs or it is only checked on one platform.
      - name: The way in is what it says it is
        run: |
          pip install --quiet pyyaml
          python3 ios/tools/check_attack_surface.py

  sproutkit:
    name: SproutKit
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios/SproutKit

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show the toolchain
        run: swift --version && xcodebuild -version

      - name: Build
        run: swift build --build-tests

      # These read spec/vectors/ straight from the working tree, so a green run
      # here means this app agrees with the format — the same files
      # SpecConformanceTest holds the Android app to.
      - name: Test
        run: swift test --skip-build

  app:
    name: App
    runs-on: macos-15
    # Compiles the app and its UI test target. It also proves the project spec,
    # the entitlements and the Info.plist are coherent, which is what a project
    # assembled without Xcode is most likely to get wrong.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The .xcodeproj is generated, not committed: project.yml is the reviewable
      # artefact. See ios/Sprout/project.yml.
      - name: Generate the project
        run: brew install xcodegen && xcodegen generate --spec ios/Sprout/project.yml --project ios/Sprout

      # Whatever iPhone this image happens to ship, by UDID. A hardcoded model
      # name is a dependency on the runner image that fails the day it changes —
      # and it fails differently in each job, because `build` quietly degrades to
      # a placeholder destination while `test` needs a device it can boot.
      - name: Choose a simulator
        id: sim
        run: |
          # Assigned, not echoed inline: `echo "x=$(cmd)"` exits 0 even when cmd
          # failed, and an empty destination is a confusing error two steps later.
          set -euo pipefail
          udid="$(python3 ios/tools/pick_simulator.py)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # `build-for-testing`, not `build`: plain `build` compiles the app target
      # and nothing else, so a syntax error in the UI tests reached CI only via
      # the screenshot job — the slow one, and the one that fails for unrelated
      # reasons. This compiles both and answers in a minute.
      - name: Build for the simulator
        run: |
          xcodebuild build-for-testing \
            -project ios/Sprout/Sprout.xcodeproj \
            -scheme Sprout \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # The half the source check cannot do. Android pins its permissions twice —
      # once as its own manifest declares them, once as the whole merged build
      # requests them — because a dependency can add one and say so nowhere else.
      # This is that second pin: the Info.plist Xcode actually wrote, and the
      # libraries the binary actually links.
      - name: The built app opens no door the source did not
        run: |
          pip3 install --quiet pyyaml
          python3 ios/tools/check_attack_surface.py \
            --app "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Sprout.app"

  screenshots:
    name: Screenshots
    runs-on: macos-15
    # Every screen, captured on a simulator and **committed to the repository** —
    # the iOS counterpart of screenshots.yml, down to the same promote-only-if-it
    # -moved rule. A pull request is far easier to review when you can see what
    # changed than when you can only read what changed, and nobody on this
    # project has a Mac to look at the app on.
    env:
      # Where the committed set lives, beside android/screenshots/.
      OUTDIR: ios/screenshots
      # The fresh capture, before anything is promoted into OUTDIR.
      STAGEDIR: .screenshots-new
      # Same rule and the same numbers as Android's, and for the same reason: a
      # capture is never byte-identical to the last one, so committing on any
      # byte difference means a churn commit on nearly every pull request.
      # Resist raising the threshold to swallow a residue — a changed word in a
      # list row is itself well under 1% of the screen, so a threshold loose
      # enough to hide the noise is loose enough to hide a regression.
      DIFF_THRESHOLD_PCT: "0.05"
      DIFF_FUZZ: "3%"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The branch itself, not the merge commit a pull_request checkout
          # gives: the commit below has to be pushable somewhere.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Generate the project
        run: brew install xcodegen && xcodegen generate --spec ios/Sprout/project.yml --project ios/Sprout

      - name: Choose a simulator
        id: sim
        run: |
          # Assigned, not echoed inline: `echo "x=$(cmd)"` exits 0 even when cmd
          # failed, and an empty destination is a confusing error two steps later.
          set -euo pipefail
          udid="$(python3 ios/tools/pick_simulator.py)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Android pins the emulator's clock; this is the same problem and the same
      # answer. The status bar is part of every capture, and its clock ticks —
      # the first run produced one screenshot reading 5:47 and the next 5:48, so
      # the images differ from each other *within* a run, never mind between
      # them. At roughly 0.1% of the frame that is above the promote threshold,
      # which would recommit all seventeen on every pull request.
      #
      # 9:41 is Apple's own, and is what every App Store screenshot shows.
      - name: Freeze the status bar
        run: |
          set -euo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          # Not fatal: the promote threshold is the backstop, and a simctl quirk
          # on some future runner image should not stop the screens being seen.
          xcrun simctl status_bar "$udid" override \
            --time "9:41" \
            --batteryState charged --batteryLevel 100 \
            --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            || echo "::warning::could not freeze the status bar; expect churn in the committed set"

      - name: Capture
        id: capture
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/Sprout/Sprout.xcodeproj \
            -scheme Sprout \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/screenshots.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # Attachments live inside the .xcresult bundle, under UUIDs.
      - name: Pull the images out of the result bundle
        # Not on a cancelled run: a superseded build has no screenshots by
        # definition, and reporting that as a failure hides the real ones.
        if: always() && steps.capture.conclusion != 'cancelled'
        run: |
          BUNDLE="$RUNNER_TEMP/screenshots.xcresult"
          OUT="$RUNNER_TEMP/screenshots"
          mkdir -p "$OUT"
          [ -d "$BUNDLE" ] || { echo "::error::no result bundle at $BUNDLE"; exit 1; }

          xcrun xcresulttool export attachments --path "$BUNDLE" --output-path "$OUT"

          # A run that captured nothing but still went green would be the worst
          # outcome here: it reads as "the screens are fine" when nobody looked.
          if [ -z "$(find "$OUT" -name '*.png' -print -quit)" ]; then
            echo "::error::no screenshots in the result bundle — the UI test did not reach a screen"
            exit 1
          fi

          # `01-home.png`, not `FB94A33F-….png`. Also drops the UI hierarchy
          # dumps, the debug descriptions and the screen recording, which are
          # useful on a failure and not something to commit.
          python3 ios/tools/name_screenshots.py "$OUT" "$STAGEDIR"

      # A capture is never byte-identical to the last one — text antialiasing
      # and the simulator's renderer vary between runs — so compare visually and
      # keep the committed PNG whenever the change is below the threshold.
      # Lifted from screenshots.yml, because the two sets should move for the
      # same reasons.
      - name: Promote only visibly-changed screenshots
        if: always() && steps.capture.conclusion != 'cancelled'
        run: |
          set -euo pipefail
          command -v compare >/dev/null 2>&1 || brew install imagemagick
          mkdir -p "$OUTDIR"
          promoted=0; added=0; kept=0
          for new in "$STAGEDIR"/*.png; do
            [ -e "$new" ] || continue
            name=$(basename "$new")
            cur="$OUTDIR/$name"
            if [ ! -f "$cur" ]; then
              cp "$new" "$cur"; added=$((added+1)); echo "  + $name (new)"; continue
            fi
            if [ "$(identify -format '%wx%h' "$cur")" != "$(identify -format '%wx%h' "$new")" ]; then
              cp "$new" "$cur"; promoted=$((promoted+1)); echo "  ~ $name (dimensions changed)"; continue
            fi
            px=$(identify -format '%[fx:w*h]' "$cur")
            raw=$(compare -metric AE -fuzz "$DIFF_FUZZ" "$cur" "$new" null: 2>&1 || true)
            n=${raw%% *}
            case "$n" in (*[!0-9.eE+-]*|'') n=$px ;; esac
            pct=$(awk -v d="$n" -v p="$px" 'BEGIN{printf "%.4f", (p>0 ? d*100/p : 100)}')
            if awk -v a="$pct" -v b="$DIFF_THRESHOLD_PCT" 'BEGIN{exit !(a>b)}'; then
              cp "$new" "$cur"; promoted=$((promoted+1)); echo "  ~ $name (${pct}% of pixels differ)"
            else
              kept=$((kept+1)); echo "    $name unchanged (${pct}% <= ${DIFF_THRESHOLD_PCT}%)"
            fi
          done
          echo "Promoted $promoted, added $added, kept $kept unchanged."

      # The fresh capture, not the promoted set — so a run that promotes nothing
      # still lets you inspect what the simulator actually rendered. The result
      # bundle goes up too: on a failure its hierarchy dumps are the evidence.
      - name: Upload the screenshots
        if: always() && steps.capture.conclusion != 'cancelled'
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: |
            ${{ env.STAGEDIR }}/*.png
            ${{ runner.temp }}/screenshots/**
          # STAGEDIR is dot-prefixed, so it counts as hidden and would be
          # silently skipped without this.
          include-hidden-files: true
          if-no-files-found: warn

      - name: Commit screenshots to the PR branch
        if: >-
          always() && steps.capture.conclusion == 'success'
          && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        run: |
          find "$OUTDIR" -type f ! -name '*.png' -delete || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A "$OUTDIR"
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            branch="${{ github.head_ref || github.ref_name }}"
            # [skip ci] keeps this PNG-only commit from starting another round of
            # workflows — including this one, which would otherwise capture,
            # commit and capture again. The parent commit has already been
            # checked and this one only changes images. See screenshots.yml for
            # why dropping the marker is worse than carrying it.
            git commit -m "ci: update iOS screenshots [skip ci]"
            # The branch can have moved since checkout. This commit only touches
            # PNGs, so replaying it on top is safe and beats failing the job on a
            # rejected push. --autostash because the build leaves other files
            # modified; we only publish $OUTDIR, so log the rest rather than
            # silently discarding it.
            echo "Working tree state before rebase:"
            git status --porcelain
            git pull --rebase --autostash origin "$branch"
            git push origin HEAD:"$branch"
          fi
