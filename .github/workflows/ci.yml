name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: sprout-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Room writes the schema JSON during the build, into the working tree. If
      # it differs from what's committed, the schema changed — and a schema
      # change without its migration and its updated JSON is exactly the kind of
      # thing that only shows up on a user's phone, after the update.
      - name: Check the committed Room schema matches the build
        run: |
          # `git status`, not `git diff`: a database version bump writes a
          # brand-new <version>.json, which is untracked and so invisible to
          # `git diff` — the check would pass while the new schema went
          # uncommitted, which is precisely the case it exists to catch.
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "::error::The exported Room schema differs from what is committed."
            echo "Commit app/schemas together with the migration that produced the change."
            git status --porcelain -- app/schemas
            git diff -- app/schemas
            # Print what the build actually produced, so the correct file can be
            # recovered straight from the run — this repo is built by CI, not on
            # a machine with an Android SDK to hand (docs/adr/0006).
            for f in $(git status --porcelain -- app/schemas | awk '{print $2}'); do
              [ -f "$f" ] || continue
              echo "===== $f ====="
              cat "$f"
            done
            exit 1
          fi
          echo "Committed Room schema is up to date."

      - name: Upload exported Room schema
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: app/schemas/**/*.json
          if-no-files-found: warn
