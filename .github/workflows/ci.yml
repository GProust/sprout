name: CI

# The Android build. Its iOS opposite number is ios.yml, and the two are kept
# apart by path filters: an iOS-only change must not spend Android CI, and a
# change under android/ must not book a Mac. Anything shared — spec/, the
# workflows themselves — deliberately triggers both.

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'spec/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'spec/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: sprout-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Room writes the schema JSON during the build, into the working tree. If
      # it differs from what's committed, the schema changed — and a schema
      # change without its migration and its updated JSON is exactly the kind of
      # thing that only shows up on a user's phone, after the update.
      - name: Check the committed Room schema matches the build
        # Runs from the repository root, not android/: `git status --porcelain`
        # prints paths relative to the root regardless of where it is invoked,
        # so a `cat` of one of them has to start there too.
        working-directory: .
        run: |
          # `git status`, not `git diff`: a database version bump writes a
          # brand-new <version>.json, which is untracked and so invisible to
          # `git diff` — the check would pass while the new schema went
          # uncommitted, which is precisely the case it exists to catch.
          if [ -n "$(git status --porcelain -- android/app/schemas)" ]; then
            echo "::error::The exported Room schema differs from what is committed."
            echo "Commit android/app/schemas together with the migration that produced the change."
            git status --porcelain -- android/app/schemas
            git diff -- android/app/schemas
            # Print what the build actually produced, so the correct file can be
            # recovered straight from the run — this repo is built by CI, not on
            # a machine with an Android SDK to hand (docs/adr/0006).
            for f in $(git status --porcelain -- android/app/schemas | awk '{print $2}'); do
              [ -f "$f" ] || continue
              echo "===== $f ====="
              cat "$f"
            done
            exit 1
          fi
          echo "Committed Room schema is up to date."

      - name: Upload exported Room schema
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: android/app/schemas/**/*.json
          if-no-files-found: warn
