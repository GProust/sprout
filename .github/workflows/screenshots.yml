name: Screenshots

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      device:
        description: 'Device to capture on. Tablet captures land in screenshots/tablet-{7,10}/ (for the Play listing''s tablet sections).'
        type: choice
        options: [phone, tablet-7, tablet-10]
        default: phone

# Allow the job to push the generated screenshots back to the PR branch.
# pull-requests: read lets the detect job list the PR's changed files.
permissions:
  contents: write
  pull-requests: read

concurrency:
  # Include the device so a manual tablet run doesn't cancel (or get
  # cancelled by) the phone run a PR push triggers on the same branch.
  group: screenshots-${{ github.head_ref || github.ref }}-${{ inputs.device || 'phone' }}
  cancel-in-progress: true

jobs:
  # Cheap gate (seconds): capture screenshots only when the PR changes
  # something that can affect the rendered UI. PRs touching only docs,
  # fastlane metadata, committed screenshots, or workflows skip the emulator
  # (~15 min) — the capture job then reports "skipped" and the workflow still
  # concludes success. Workflow edits don't re-capture either; validate those
  # with a manual run (workflow_dispatch always captures).
  changes:
    name: Detect UI changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - name: Check the PR's changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        # UI-relevant: app code/resources and Gradle build files, except JVM
        # unit tests (app/src/test/**), which can't change what is rendered.
        run: |
          CHANGED=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          printf 'Changed files:\n%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -v '^app/src/test/' | grep -qE '^(app/|gradle/|(build|settings)\.gradle\.kts$|gradle\.properties$)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  screenshots:
    name: Capture UI screenshots
    runs-on: ubuntu-latest
    needs: changes
    # !cancelled() lets this run on workflow_dispatch, where `changes` is
    # skipped (a skipped need would otherwise auto-skip this job too).
    # Don't run on forks (no write access / no secrets).
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.outputs.ui == 'true' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    env:
      # Device profiles: pixel_3 is 1080x2160 (2:1) — Play needs >=1080px
      # phone screenshots with an aspect ratio no taller than 2:1. The
      # tablets match Play's 7-inch and 10-inch listing sections; their
      # captures go to their own directory and never overwrite the phone set.
      # tablet-7 uses Nexus 9 (2048x1536): the "Nexus 7" AVD profile is the
      # 2012 model (800x1280), below Play's 1080px minimum.
      PROFILE: ${{ inputs.device == 'tablet-7' && 'Nexus 9' || inputs.device == 'tablet-10' && 'Nexus 10' || 'pixel_3' }}
      OUTDIR: ${{ inputs.device == 'tablet-7' && 'screenshots/tablet-7' || inputs.device == 'tablet-10' && 'screenshots/tablet-10' || 'screenshots' }}
      # Fresh capture lands here first and is promoted into OUTDIR only where it
      # differs visibly (see "Promote only visibly-changed screenshots").
      STAGEDIR: .screenshots-new
      # The emulator clock is pinned to this instant so captures are
      # reproducible. ScreenshotTest seeds every timestamp from
      # System.currentTimeMillis(), so without this the history rows render the
      # real wall-clock time and *every* run produced different pixels — which
      # is what made this workflow commit new PNGs on essentially every PR.
      # toybox `date` format: MMDDhhmmYYYY.ss (here 2026-06-15 09:00:00 UTC).
      FAKE_CLOCK: "061509002026.00"
      # A file is treated as changed when more than this share of its pixels
      # differ (after DIFF_FUZZ absorbs antialiasing/GPU colour jitter).
      #
      # Measured once the committed baseline was itself captured with the clock
      # pinned: 32 of 35 captures came out byte-identical — including the
      # dashboard, which renders a relative "time since last feed" and used to
      # change on every run. The 3 that still move differ by a byte or six.
      #
      # Resist raising this to swallow that 0.66%: a changed word in a list row
      # is itself well under 1% of the screen, so a threshold loose enough to
      # hide the residue is loose enough to hide a real regression. The residue
      # wants fixing at the source (deterministic list rendering), not masking.
      DIFF_THRESHOLD_PCT: "0.05"
      DIFF_FUZZ: "3%"

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          # head_ref is set for pull_request; fall back to ref_name for manual runs.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build app + test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run screenshot test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          # NOTE: android-emulator-runner runs each line in its own shell, so
          # multi-line constructs must stay on one line. We install + `am instrument`
          # (instead of Gradle's connectedAndroidTest, which uninstalls the app
          # afterwards and wipes the captured screenshots) so the app stays
          # installed and `run-as` can read its internal files.
          script: |
            adb root && adb wait-for-device || true
            adb shell settings put global auto_time 0 || true
            adb shell settings put global auto_time_zone 0 || true
            adb shell setprop persist.sys.timezone UTC || true
            adb shell "date -u $FAKE_CLOCK" || adb shell "su 0 date -u $FAKE_CLOCK" || true
            echo "Emulator clock now: $(adb shell date -u)"
            adb install -r -t app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.gproust.sprout.ScreenshotTest com.gproust.sprout.test/androidx.test.runner.AndroidJUnitRunner
            mkdir -p "$STAGEDIR"
            for f in $(adb exec-out run-as com.gproust.sprout ls files/screenshots 2>/dev/null); do n=$(echo "$f" | tr -d '\r'); adb exec-out run-as com.gproust.sprout cat "files/screenshots/$n" > "$STAGEDIR/$n"; done
            ls -1 "$STAGEDIR" || true

      # A capture is never byte-identical to the last one: text antialiasing and
      # the software GPU vary slightly between runs. Committing on any byte
      # difference meant a churn commit on nearly every PR, so compare visually
      # and keep the committed PNG whenever the change is below the threshold.
      - name: Promote only visibly-changed screenshots
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          mkdir -p "$OUTDIR"
          promoted=0; added=0; kept=0
          for new in "$STAGEDIR"/*.png; do
            [ -e "$new" ] || continue
            name=$(basename "$new")
            cur="$OUTDIR/$name"
            if [ ! -f "$cur" ]; then
              cp "$new" "$cur"; added=$((added+1)); echo "  + $name (new)"; continue
            fi
            if [ "$(identify -format '%wx%h' "$cur")" != "$(identify -format '%wx%h' "$new")" ]; then
              cp "$new" "$cur"; promoted=$((promoted+1)); echo "  ~ $name (dimensions changed)"; continue
            fi
            px=$(identify -format '%[fx:w*h]' "$cur")
            raw=$(compare -metric AE -fuzz "$DIFF_FUZZ" "$cur" "$new" null: 2>&1 || true)
            n=${raw%% *}
            case "$n" in (*[!0-9.eE+-]*|'') n=$px ;; esac
            pct=$(awk -v d="$n" -v p="$px" 'BEGIN{printf "%.4f", (p>0 ? d*100/p : 100)}')
            if awk -v a="$pct" -v b="$DIFF_THRESHOLD_PCT" 'BEGIN{exit !(a>b)}'; then
              cp "$new" "$cur"; promoted=$((promoted+1)); echo "  ~ $name (${pct}% of pixels differ)"
            else
              kept=$((kept+1)); echo "    $name unchanged (${pct}% <= ${DIFF_THRESHOLD_PCT}%)"
            fi
          done
          echo "Promoted $promoted, added $added, kept $kept unchanged."

      # The fresh capture, not the promoted set — so a run that promotes nothing
      # still lets you inspect what the emulator actually rendered.
      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots-${{ inputs.device || 'phone' }}
          path: ${{ env.STAGEDIR }}/*.png
          # STAGEDIR is dot-prefixed, so it counts as hidden and would be
          # silently skipped without this.
          include-hidden-files: true
          if-no-files-found: warn

      - name: Commit screenshots to the PR branch
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          find screenshots -type f ! -name '*.png' -delete || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            branch="${{ github.head_ref || github.ref_name }}"
            # [skip ci] keeps this PNG-only commit from starting another round of
            # workflows — including this one, which would otherwise capture,
            # commit and capture again. It does mean the PR head carries no CI
            # check, but the parent commit has already been checked and this one
            # only changes images. Dropping the marker was tried and made things
            # worse: the run is then created but parked in `action_required`, so
            # the head still has no check and the PR reads `unstable`.
            git commit -m "ci: update UI screenshots [skip ci]"
            # The branch can have moved since checkout (a push during the ~15
            # minutes the emulator takes, or a manual run racing a PR run).
            # This commit only touches PNGs, so replaying it on top is safe and
            # beats failing the job on a rejected push.
            #
            # --autostash because the build leaves other files modified in the
            # working tree, which plain --rebase refuses to run with. We only
            # publish `screenshots`, so whatever else the build touched is not
            # ours to commit; log it rather than silently discarding it.
            echo "Working tree state before rebase:"
            git status --porcelain
            git pull --rebase --autostash origin "$branch"
            git push origin HEAD:"$branch"
          fi
