# The Xcode project, as a spec rather than as a .pbxproj.
#
# XcodeGen generates Sprout.xcodeproj from this file, and the generated project
# is not committed (see .gitignore). A hand-maintained .pbxproj is thousands of
# lines of machine-written XML that no reviewer reads, merges badly, and hides
# exactly the settings worth arguing about — the entitlements, the deployment
# target, the capabilities. Those are all visible here.
#
#   brew install xcodegen
#   cd ios/Sprout && xcodegen generate && open Sprout.xcodeproj

name: Sprout

options:
  bundleIdPrefix: com.gproust
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: '5.9'
    # ADR-0002 and ADR-0014: Sprout makes no network calls, so nothing here
    # should ever need an exception. Left at the default deny.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # What App Store Connect shows as the version, and what the listing's
    # Version field has to match. The iOS app keeps its own numbering: it is
    # a first release, not Android's 1.13. Here rather than on the app target
    # because the Live Activity extension is shipped inside the app and has to
    # carry the same version and build, or App Store Connect refuses the upload.
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'

packages:
  SproutKit:
    path: ../SproutKit

targets:
  Sprout:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # What the app and its Live Activity both need to agree on: the
      # activity's shape, and the intent its buttons run (ADR-0020).
      - path: Shared
    dependencies:
      - package: SproutKit
        product: SproutKit
      - package: SproutKit
        product: SproutData
      # The one extension, embedded in the app (ADR-0020).
      - target: SproutLiveActivity
    # Generated rather than hand-written. A plist assembled by hand is missing
    # CFBundleIdentifier and CFBundleExecutable until the day something tries to
    # *launch* the app — it builds perfectly without them — and the failure then
    # arrives as "the bundle identifier couldn't be read" from a test runner,
    # nowhere near the file that caused it. XcodeGen fills in the standard keys
    # and these are the ones Sprout actually decides.
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Sprout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The seven languages Sprout speaks (BDR-0004). Listing them is what
        # gives the user the per-app language picker in iOS Settings, which is
        # why AppLocale.kt has no counterpart on this side.
        CFBundleLocalizations: [en, fr, de, es, it, pl, pt]
        # ADR-0010 and ADR-0016: the radio is used only while the app is open.
        # No background mode is declared and none should be — that would be a
        # claim this app does not make.
        NSBluetoothAlwaysUsageDescription: >-
          Sprout uses Bluetooth only while it is open, to sync this baby's record
          with the other phones in your household. Nothing is sent anywhere else.
        # The one way in from outside (ADR-0014). Android's manifest offers
        # Sprout for a file another app hands it; this is the same door, and it
        # is the same size: one type, ours, and nothing else. A replica arriving
        # through it is parsed with nothing authenticated at all, which is why
        # `SyncFiles.read` caps what it will read and `SyncLimits` is checked
        # before the parse rather than around it.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.gproust.sprout.sync
            UTTypeDescription: Sprout record
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [sprout]
              public.mime-type: [application/vnd.sprout.sync]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Sprout record
            LSHandlerRank: Owner
            CFBundleTypeRole: Viewer
            LSItemContentTypes: [com.gproust.sprout.sync]
        # The export-compliance answer, given once here instead of on every
        # upload. Every cipher Sprout uses is the operating system's own —
        # CryptoKit for the household exchange, CommonCrypto for the AES block
        # of a locked export (BDR-13) — which Apple treats as exempt. A cipher
        # of our own, or a crypto library, would make this answer wrong.
        ITSAppUsesNonExemptEncryption: false
        # A running breastfeed on the lock screen and in the Dynamic Island
        # (BDR-24, ADR-0020). Updated by the app alone — there is no push, and
        # `aps-environment` stays refused.
        NSSupportsLiveActivities: true
        # Deliberately absent, and the absence is the point (ADR-0014): no
        # NSAppTransportSecurity, no URL scheme, no networking usage string,
        # because there is no networking. That is the iOS equivalent of Android's
        # missing INTERNET permission.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gproust.sprout
        CODE_SIGN_ENTITLEMENTS: Sources/Sprout.entitlements
        # The icon is rendered from Android's launcher vector by
        # ios/tools/make_app_icon.py — one product, one icon, and CI checks the
        # committed PNG is still what that vector produces.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only. Nothing here has been laid out or looked at on an iPad,
        # and declaring one brings two obligations with it: a set of iPad
        # screenshots for the listing, and — because the app is portrait-only —
        # an upload that App Store Connect refuses, since an iPad app that can
        # multitask must support every orientation. An iPhone app still runs on
        # an iPad, in the iPhone-sized window. Widening this is a decision to
        # make with an iPad in hand.
        TARGETED_DEVICE_FAMILY: '1'
      configs:
        # Signing for the App Store build, and for that build only: the iOS
        # release workflow (.github/workflows/ios-release.yml) archives Release
        # with the distribution certificate and the App Store profile it gets
        # from the repository's secrets. The team and the profile's UUID are
        # read from the profile at build time and passed in as these two
        # variables, so neither is written here. They sit on this target rather
        # than on xcodebuild's command line, because a profile given there
        # applies to every target, the Swift packages included, and a package
        # refuses one. Debug is untouched: CI builds it for the simulator with
        # signing switched off.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: $(SPROUT_TEAM_ID)
          PROVISIONING_PROFILE_SPECIFIER: $(SPROUT_PROVISIONING_PROFILE)

  # The Live Activity (BDR-24, ADR-0020) — the first extension, and the only
  # one. It draws a running breastfeed and nothing else: no database, no
  # session store, no entitlements, no network. Its buttons are intents the
  # system runs in the app's own process. check_attack_surface.py pins it like
  # the app, and check_no_network.py scans its sources like the app's.
  SproutLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Shared
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Sprout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gproust.sprout.LiveActivity
        TARGETED_DEVICE_FAMILY: '1'
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        # Signed like the app, with an App Store profile of its own: every
        # bundle inside the upload is signed for its own identifier. The
        # release workflow reads the profile's UUID from its own secret and
        # passes it in here, as it does the app's (docs/RELEASING.md §9).
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          DEVELOPMENT_TEAM: $(SPROUT_TEAM_ID)
          PROVISIONING_PROFILE_SPECIFIER: $(SPROUT_LIVE_ACTIVITY_PROFILE)

  SproutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Sprout
    info:
      path: UITests/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gproust.sprout.uitests
        TEST_TARGET_NAME: Sprout

schemes:
  Sprout:
    build:
      targets:
        Sprout: all
        SproutUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SproutUITests
